<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Buses</title><link rel="stylesheet" href="../css/style.css"></head><body><nav><a class="brand" href="index.html">🚌 BusPlanner Admin</a><div><a href="admin-dashboard.html">Dashboard</a><a href="admin-routes.html">Routes</a><a href="admin-bookings.html">Bookings</a></div></nav><main class="container"><h1>Manage Buses</h1><section class="card"><h2>Add Bus</h2><form id="busForm" class="form-grid"><input id="busNumber" placeholder="Bus Number" required><input id="busName" placeholder="Bus Name" required><input id="routeId" type="number" placeholder="Route ID" required><input id="totalSeats" type="number" min="1" value="40" required><input id="availableSeats" type="number" min="0" value="40" required><input id="location" placeholder="Current Location" required><select id="status"><option>Available</option><option>Running</option><option>Delayed</option><option>Completed</option><option>Cancelled</option></select><input id="departure" type="time" required><input id="arrival" type="time" required><button class="btn">Add Bus</button></form><p id="message" class="message"></p></section><section class="card"><h2>All Buses</h2><div id="buses" class="table-wrap"></div></section></main><script src="../js/api.js"></script><script src="../js/admin.js"></script></body></html>
